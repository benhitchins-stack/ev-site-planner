name: Planner checks

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static, lifecycle and calculation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm run build
      - name: Generated pages and asset versions are current
        run: git diff --exit-code -- public
      - run: npm test
  browser:
    name: Browser / ${{ matrix.suite }}
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [browser, profile, design, refinement, debug, presentation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned browser test tool
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:${{ matrix.suite }}
        env:
          EVSP_TEST_OUTPUT: ${{ runner.temp }}/evsp-${{ matrix.suite }}
      - name: Keep results and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.suite }}
          path: ${{ runner.temp }}/evsp-${{ matrix.suite }}
          if-no-files-found: ignore
          retention-days: 14
