name: Vendor verified PDF.js release
on:
  push:
    branches: [codex/planning-tools-2026-10-02]
    paths: [scripts/vendor-pdfjs.py, .github/workflows/vendor-pdfjs.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/vendor-pdfjs.py
      - name: Commit verified distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/vendor/pdfjs
          if ! git diff --cached --quiet; then
            git commit -m "Vendor verified PDF.js 6.3.289 legacy distribution"
            git push
          fi
